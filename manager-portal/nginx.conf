# Static server for the built manager portal. /api is NOT handled here — the edge
# router in deploy/edge sends API traffic straight to the api service.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location = / {
        return 302 /manager/;
    }

    location /manager/ {
        try_files $uri $uri/ /manager/index.html;
    }

    location ~* \.(js|css|woff2?|ttf|svg|png|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /manager/index.html {
        add_header Cache-Control "no-cache";
    }
}
