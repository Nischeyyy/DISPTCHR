name: Staging end-to-end verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disptchr-staging-e2e
  cancel-in-progress: false

jobs:
  disposable-staging:
    runs-on: ubuntu-latest
    environment: staging
    defaults: { run: { working-directory: backend } }
    env:
      DISPTCHR_E2E_ENABLED: "1"
      DISPTCHR_E2E_BASE_URL: ${{ secrets.DISPTCHR_E2E_BASE_URL }}
      DISPTCHR_E2E_GUARD_EMAIL: ${{ secrets.DISPTCHR_E2E_GUARD_EMAIL }}
      DISPTCHR_E2E_GUARD_PASSWORD: ${{ secrets.DISPTCHR_E2E_GUARD_PASSWORD }}
      DISPTCHR_E2E_MANAGER_EMAIL: ${{ secrets.DISPTCHR_E2E_MANAGER_EMAIL }}
      DISPTCHR_E2E_MANAGER_PASSWORD: ${{ secrets.DISPTCHR_E2E_MANAGER_PASSWORD }}
      DISPTCHR_E2E_MANAGER_MFA_SECRET: ${{ secrets.DISPTCHR_E2E_MANAGER_MFA_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Require disposable staging credentials
        run: |
          : "${DISPTCHR_E2E_BASE_URL:?Missing staging base URL}"
          : "${DISPTCHR_E2E_GUARD_EMAIL:?Missing staging guard account}"
          : "${DISPTCHR_E2E_GUARD_PASSWORD:?Missing staging guard password}"
          : "${DISPTCHR_E2E_MANAGER_EMAIL:?Missing staging manager account}"
          : "${DISPTCHR_E2E_MANAGER_PASSWORD:?Missing staging manager password}"
          : "${DISPTCHR_E2E_MANAGER_MFA_SECRET:?Missing staging manager MFA secret}"
      - run: pytest tests/backend_test.py -q
