name: Platform checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: disptchr_ci
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      PII_ENCRYPTION_KEY: XsEh4JQ9QnQ6PqZDCf2fEvWguzVhKqM5-3xYpKz0OHU=
      APP_ENV: test
      ALLOW_PUBLIC_REGISTRATION: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile server.py notifications.py object_storage.py jobs.py job_worker.py worker_healthcheck.py
      - run: pip-audit -r requirements.txt
      - run: bandit -q -r server.py notifications.py object_storage.py jobs.py job_worker.py worker_healthcheck.py
      - run: pytest tests -q

  disposable-api-e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: disptchr_e2e_${{ github.run_id }}
      JWT_SECRET: e2e-only-secret-e2e-only-secret-e2e-only-secret
      PII_ENCRYPTION_KEY: XsEh4JQ9QnQ6PqZDCf2fEvWguzVhKqM5-3xYpKz0OHU=
      CONTROL_PANEL_API_KEY: e2e-control-key-e2e-control-key-e2e-control-key
      APP_ENV: test
      ALLOW_PUBLIC_REGISTRATION: "false"
      DISPTCHR_E2E_ENABLED: "1"
      DISPTCHR_E2E_BOOTSTRAP: "1"
      DISPTCHR_E2E_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Run complete API workflow
        run: |
          uvicorn server:app --host 127.0.0.1 --port 8000 > /tmp/disptchr-e2e-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then cat /tmp/disptchr-e2e-api.log; exit 1; fi
            sleep 1
          done
          if ! pytest tests/backend_test.py -q; then
            cat /tmp/disptchr-e2e-api.log
            exit 1
          fi

  manager-portal:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: manager-portal } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: manager-portal/package-lock.json }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build

  guard-app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: yarn, cache-dependency-path: frontend/yarn.lock }
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: npx expo-doctor
      - run: yarn lint
      - run: npx tsc --noEmit
      - run: yarn audit --groups dependencies --level moderate
      - run: npx expo export --platform ios
      - run: npx expo export --platform android

  container-images:
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://database.invalid:27017
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      PII_ENCRYPTION_KEY: XsEh4JQ9QnQ6PqZDCf2fEvWguzVhKqM5-3xYpKz0OHU=
      CONTROL_PANEL_API_KEY: ci-control-key-ci-control-key-ci-control-key
      METRICS_TOKEN: ci-metrics-token-ci-metrics-token-ci-metrics
      CORS_ORIGINS: https://app.example.invalid
      RATE_LIMIT_STORAGE_URI: redis://cache.invalid:6379/0
      S3_BUCKET: disptchr-ci
      SENDGRID_API_KEY: ci-sendgrid-key
      SENDGRID_FROM_EMAIL: notifications@example.invalid
      TWILIO_ACCOUNT_SID: ci-twilio-sid
      TWILIO_AUTH_TOKEN: ci-twilio-token
      TWILIO_FROM_NUMBER: "+14165550123"
      DISPATCH_PHONE: "+14165550124"
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker build --tag disptchr-api:ci backend
      - run: docker build --tag disptchr-manager:ci manager-portal
      - run: docker build --tag disptchr-edge:ci deploy/edge
