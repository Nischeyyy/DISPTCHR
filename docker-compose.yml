# DISPTCHR production stack — read by Openship (Project -> Services) and by plain `docker compose`.
#
#   edge (public, :80) ─┬─ /api, /uploads, /docs ──> api (:8001) ──> mongo (:27017)
#                       ├─ /manager/*           ──> manager-portal
#                       └─ /*                   ──> guard-web
#
# Only `edge` should be marked Public in Openship. Everything else stays Internal.
# Copy .env.example to .env (or set the same keys in Openship -> Environment) before deploying.

services:
  edge:
    build: ./deploy/edge
    ports:
      - "80"
    depends_on:
      - api
      - manager-portal
      - guard-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build: ./backend
    ports:
      - "8001"
    environment:
      # Default points at the bundled mongo service. To use MongoDB Atlas instead,
      # set MONGO_URL to your mongodb+srv:// string and disable the mongo service.
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      DB_NAME: ${DB_NAME:-disptchr}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-168}
      # Optional channels — the backend disables each one cleanly when unset.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      EMERGENT_PUSH_KEY: ${EMERGENT_PUSH_KEY:-}
    volumes:
      # Incident attachments + generated pay stubs must survive redeploys (payroll retention).
      - uploads:/app/uploads
    depends_on:
      - mongo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  manager-portal:
    build: ./manager-portal
    ports:
      - "80"
    restart: unless-stopped

  guard-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.web
    ports:
      - "80"
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  uploads:
  mongo-data:
