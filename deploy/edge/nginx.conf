# Edge router: one public hostname, three upstreams on the private compose network.
# Openship terminates TLS in front of this container and forwards plain HTTP to port 80.

# Resolve service names at request time so a restarted upstream never wedges nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Incident photos / documents are uploaded through the API.
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 120s;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # ---- API ------------------------------------------------------------
    set $api http://api:8001;

    location /api/          { proxy_pass $api; }
    location /uploads/      { proxy_pass $api; }
    location = /docs        { proxy_pass $api; }
    location = /openapi.json{ proxy_pass $api; }

    # ---- Manager portal (desktop/admin) ----------------------------------
    set $manager http://manager-portal:80;

    location /manager/ { proxy_pass $manager; }
    location = /manager { return 302 /manager/; }

    # ---- Guard app (Expo web) --------------------------------------------
    set $guard http://guard-web:80;

    location / { proxy_pass $guard; }
}
