# Edge router for the manager website and API. The guard product ships only as a native app.
# Openship terminates TLS in front of this container and forwards plain HTTP to port 80.

# Resolve service names at request time so a restarted upstream never wedges nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $hsts_header {
    default "";
    https "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    server_name _;

    add_header Strict-Transport-Security $hsts_header always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:" always;

    # Incident photos / documents are uploaded through the API.
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 120s;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # ---- API ------------------------------------------------------------
    set $api http://api:8001;

    location /api/          { proxy_pass $api; }

    # ---- Manager portal (desktop/admin) ----------------------------------
    set $manager http://manager-portal:80;

    location /manager/ { proxy_pass $manager; }
    location = /manager { return 302 /manager/; }

    location = / { return 302 /manager/; }
    location / { return 404; }
}
